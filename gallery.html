<!doctype html>
<html lang="en" class="no-js">

<head>
  {{> head title="Gallery — Nywele Nzuri by Jaz | Salon, Barbershop & Spa, Nairobi" desc="A glimpse inside Nywele Nzuri by Jaz — cuts, colour, nails and spa moments from our Nairobi salon, barbershop and spa."}}
</head>

<body>
  {{> header}}

  <section class="page-hero">
    <div class="absolute inset-0 bg-cover bg-center opacity-25" style="background-image:url('/assets/img/gallery/g4.jpg')"></div>
    <div class="container-lux relative text-center py-20 sm:py-28 md:py-36">
      <h1 class="title-xl text-white">Our <span class="text-gold-grad">Gallery</span></h1>
      <p class="mt-4 text-[12px] uppercase tracking-luxe text-gold-light">Home <span class="text-white/40 mx-2">/</span> Gallery</p>
    </div>
  </section>

  <section class="section">
    <div class="container-lux">
      <div class="columns-1 sm:columns-2 lg:columns-3 gap-4 [column-fill:_balance]">
        <figure class="gallery-item mb-4 overflow-hidden rounded-[3px] reveal break-inside-avoid"><img loading="lazy" decoding="async" src="/assets/img/gallery/g1.jpg" alt="" class="w-full object-cover transition-transform duration-700 ease-lux hover:scale-105" /></figure>
        <figure class="gallery-item mb-4 overflow-hidden rounded-[3px] reveal break-inside-avoid"><img loading="lazy" decoding="async" src="/assets/img/gallery/g2.jpg" alt="" class="w-full object-cover transition-transform duration-700 ease-lux hover:scale-105" /></figure>
        <figure class="gallery-item mb-4 overflow-hidden rounded-[3px] reveal break-inside-avoid"><img loading="lazy" decoding="async" src="/assets/img/gallery/g3.jpg" alt="" class="w-full object-cover transition-transform duration-700 ease-lux hover:scale-105" /></figure>
        <figure class="gallery-item mb-4 overflow-hidden rounded-[3px] reveal break-inside-avoid"><img loading="lazy" decoding="async" src="/assets/img/gallery/g4.jpg" alt="" class="w-full object-cover transition-transform duration-700 ease-lux hover:scale-105" /></figure>
        <figure class="gallery-item mb-4 overflow-hidden rounded-[3px] reveal break-inside-avoid"><img loading="lazy" decoding="async" src="/assets/img/gallery/g5.jpg" alt="" class="w-full object-cover transition-transform duration-700 ease-lux hover:scale-105" /></figure>
        <figure class="gallery-item mb-4 overflow-hidden rounded-[3px] reveal break-inside-avoid"><img loading="lazy" decoding="async" src="/assets/img/gallery/g6.jpg" alt="" class="w-full object-cover transition-transform duration-700 ease-lux hover:scale-105" /></figure>
        <figure class="gallery-item mb-4 overflow-hidden rounded-[3px] reveal break-inside-avoid"><img loading="lazy" decoding="async" src="/assets/img/gallery/g7.jpg" alt="" class="w-full object-cover transition-transform duration-700 ease-lux hover:scale-105" /></figure>
        <figure class="gallery-item mb-4 overflow-hidden rounded-[3px] reveal break-inside-avoid"><img loading="lazy" decoding="async" src="/assets/img/gallery/g8.jpg" alt="" class="w-full object-cover transition-transform duration-700 ease-lux hover:scale-105" /></figure>
        <figure class="gallery-item mb-4 overflow-hidden rounded-[3px] reveal break-inside-avoid"><img loading="lazy" decoding="async" src="/assets/img/gallery/g9.jpg" alt="" class="w-full object-cover transition-transform duration-700 ease-lux hover:scale-105" /></figure>
      </div>
      <div class="text-center mt-14 reveal">
        <a href="https://www.instagram.com/nywelenzuribyjaz/" target="_blank" rel="noopener" class="btn btn-outline">Follow us on Instagram</a>
      </div>
    </div>
  </section>

  {{> footer}}
</body>

</html>
